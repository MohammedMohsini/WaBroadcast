<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#030712"/>
  <title>WaBroadcast</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100%;height:100%}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#030712;color:#f1f5f9;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}
    input,textarea,button{font-family:inherit}
    input::placeholder,textarea::placeholder{color:#374151}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    @keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
